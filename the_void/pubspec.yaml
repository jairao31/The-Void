name: the_void
description: The app that does nothing. That's the whole point.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.4.0

  # Navigation
  go_router: ^12.1.0

  # Local database
  drift: ^2.14.0
  drift_flutter: ^0.1.0
  sqlite3_flutter_libs: ^0.5.0

  # Encryption
  encrypt: ^5.0.3
  crypto: ^3.0.3

  # Secure storage
  flutter_secure_storage: ^9.0.0

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  firebase_storage: ^12.0.0
  google_sign_in: ^6.1.6

  # Notifications
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2

  # Utilities
  uuid: ^4.2.1
  shared_preferences: ^2.2.0
  path_provider: ^2.1.0
  path: ^1.8.0
  intl: ^0.18.1

  # UI
  flutter_animate: ^4.3.0
  google_fonts: ^6.1.0
  screenshot: ^2.1.0
  share_plus: ^7.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  drift_dev: ^2.14.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/

  fonts: []
